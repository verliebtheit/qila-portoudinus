<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#fce8dc" />
		<meta
			name="description"
			content="Qila is a student developer building small, playful things for the web. A pink, pixelated corner of the internet about learning, games, photos, and music."
		/>
		<script>
			(function () {
				var root = document.documentElement;
				try {
					if (localStorage.getItem('qila.theme') === 'dark') root.classList.add('dark');
				} catch (error) {
					/* private mode can say no */
				}
				if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
				try {
					if (sessionStorage.getItem('qila.boot') !== 'done') root.classList.add('is-booting');
				} catch (error) {
					/* no storage, no intro */
				}
			})();
		</script>
		<noscript>
			<style>
				html.is-booting {
					overflow: auto;
				}
				html.is-booting .boot-screen {
					display: none;
				}
			</style>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
